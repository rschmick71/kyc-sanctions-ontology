[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kso"
version = "0.1.1"
description = "KYC & Sanctions Ontology (1LOD) — OWL/SKOS/SHACL model with Python validation tooling"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ron Schmick" }]
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    "pyshacl>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kso = "kso.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
